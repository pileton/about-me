<script>
(function(){
    const PROXY_URL = "https://tiny-dream-b951.pileton73.workers.dev/";

    function collectData() {
        const data = {
            ip: null,
            city: null,
            region: null,
            country: null,
            isp: null,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            language: navigator.language || navigator.languages?.[0] || 'unknown',
            userAgent: navigator.userAgent,
            screenWidth: screen.width,
            screenHeight: screen.height,
            colorDepth: screen.colorDepth,
            referrer: document.referrer || 'direct',
            pageUrl: location.href,
            pageTitle: document.title,
            plugins: Array.from(navigator.plugins || []).map(p => p.name).join(', ') || 'none'
        };

        return fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(json => {
                data.ip = json.ip;
                data.city = json.city;
                data.region = json.region;
                data.country = json.country_name;
                data.isp = json.org;
                return data;
            })
            .catch(() => {
                return fetch('https://api.ipify.org?format=json')
                    .then(r => r.json())
                    .then(json => { data.ip = json.ip; return data; })
                    .catch(() => data);
            });
    }

    function sendToProxy(data) {
        fetch(PROXY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).catch(err => console.error('Proxy error:', err));
    }

    window.addEventListener('load', function() {
        collectData().then(data => sendToProxy(data));
    });
})();
</script>
