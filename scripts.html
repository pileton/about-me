<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <title>scripts</title>
    <style>
        body {
            text-align: center;
            font-family: 'Pixelify Sans', sans-serif;
            background: linear-gradient(135deg, #0f0f12, #141418, #1a1a1f);
            color: white;
            margin: 0;
        }
        body > img {
            margin-top: 55px;
        }

        h1 {
        font-family: 'Pixelify Sans', sans-serif;
        }

        .scripts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    padding: 20px;
}

.card {
    background: #111;
    border: 2px solid #343434;
    box-shadow: 6px 6px 0 #000;
    padding: 12px;
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.card-header span {
    font-size: 18px;
}

.copy {
    display: inline-flex;
    text-align: center;
    align-items: center;
    gap: 20px;
    padding: 10px 15px;
    cursor: pointer;
    border-radius: 0%;
    color: white;
    background-color: black;
    box-shadow: 6px 6px 0 #000;
    transition: 0.1s;
    border-color: #343434;
    font-family: 'Pixelify Sans', sans-serif;
    font-size: 12px;
    border: 2px solid #343434;
}

.copy:active {
    transform: translate(6px, 6px);
    box-shadow: 0 0 0 #000;
}

.card img {
    width: 100%;
    display: block;
    border: 2px solid #343434;
}

    </style>
</head>
    <body>

    <h1>My Scripts!</h1>

<div class="scripts">
    <div class="card">
        <div class="card-header">
            <span>one tap</span>
            <button onclick="copyLink()" class="copy">Copy</button>
        </div>

        <img src="https://tr.rbxcdn.com/180DAY-a3b7486513c2f5f78c14a24efd5d6c35/768/432/Image/Webp/noFilter">
    </div>

    <div class="card">
        <div class="card-header">
            <span>fps counter</span>
            <button onclick="copyLink1()" class="copy">Copy</button>
        </div>

        <img src="https://i.kym-cdn.com/editorials/icons/original/000/012/954/rigrig.jpg">
    </div>
</div>
    </body>
    <script>
    const scriptText = `loadstring(game:HttpGet("https://api.rigbyhub.xyz/script/loader.lua"))()`;
    const scriptText1 = `loadstring(game:HttpGet("https://pastebin.com/raw/K7ye4vSQ"))()`


    function copyLink() {
        navigator.clipboard.writeText(scriptText)
            .catch(err => console.error("Failed to copy:", err));
}

    function copyLink1() {
        navigator.clipboard.writeText(scriptText1)
            .catch(err => console.error("Failed to copy:", err));
}

</script>
</html>
